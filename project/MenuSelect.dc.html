<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<link rel="stylesheet" href="_ds/airly-fairytale-design-system-997ac652-003b-441a-a309-9d3abea33b6e/tokens/fonts.css">
<style>
  :root {
    --mu-bone: #F7F6F3; --mu-surface: #FFFFFF; --mu-fill: #F2F1EC;
    --mu-line: #E4E2DA; --mu-line-strong: #D2CFC5;
    --mu-ink: #191C1A; --mu-ink-2: #5B615D; --mu-ink-3: #8C918C;
    --mu-green: #0F5140; --mu-green-soft: #E8F0EC;
    --mu-ring: 0 0 0 3px rgba(15,81,64,0.16);
    --mu-pop: 0 1px 2px rgba(25,28,26,0.06), 0 12px 28px -8px rgba(25,28,26,0.18);
    --mu-fa: "Font Awesome 6 Sharp";
  }
  @keyframes mu-pop { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: translateY(0); } }
</style>
</helmet>

<div ref="{{ rootRef }}" style="position:relative;width:100%;font-family:'DM Sans',system-ui,sans-serif">
  <button type="button" style="{{ triggerStyle }}" style-hover="border-color:var(--mu-line-strong)" style-focus-visible="outline:none;box-shadow:var(--mu-ring)" onClick="{{ toggle }}" onKeyDown="{{ onKey }}" aria-haspopup="listbox" aria-expanded="{{ open }}">
    <span style="flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ label }}</span>
    <span style="{{ caretStyle }}">&#xf078;</span>
  </button>

  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div style="{{ panelStyle }}">
      <sc-if value="{{ searchable }}" hint-placeholder-val="{{ false }}">
        <div style="padding:7px 8px;border-bottom:1px solid var(--mu-line);display:flex;align-items:center;gap:8px">
          <span style="font-family:var(--mu-fa);font-weight:300;font-size:12px;color:var(--mu-ink-3);flex:none">&#xf002;</span>
          <input type="text" value="{{ query }}" onChange="{{ onQuery }}" autoFocus="{{ true }}" placeholder="Filter..." style="flex:1;min-width:0;border:0;outline:none;background:transparent;font-family:'DM Sans',system-ui,sans-serif;font-size:13px;color:var(--mu-ink);padding:2px 0">
        </div>
      </sc-if>
      <div ref="{{ listRef }}" style="{{ listStyle }}" role="listbox">
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="6">
          <button type="button" role="option" aria-selected="{{ it.selected }}" style="{{ it.style }}" style-hover="background:var(--mu-fill)" onClick="{{ it.pick }}">
            <span style="flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ it.label }}</span>
            <sc-if value="{{ it.selected }}" hint-placeholder-val="{{ false }}">
              <span style="font-family:var(--mu-fa);font-weight:900;font-size:11px;color:var(--mu-green);flex:none">&#xf00c;</span>
            </sc-if>
          </button>
        </sc-for>
        <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
          <span style="display:block;padding:10px 12px;font-size:13px;color:var(--mu-ink-3)">No matches.</span>
        </sc-if>
      </div>
    </div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:260},&quot;options&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{value: string, label: string}&gt;&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(value: string) =&gt; void&quot;},&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Select&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sm&quot;,&quot;md&quot;],&quot;default&quot;:&quot;md&quot;,&quot;tsType&quot;:&quot;'sm' | 'md'&quot;},&quot;placement&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;down&quot;,&quot;up&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;'auto' | 'down' | 'up'&quot;},&quot;searchable&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { open: false, up: false, maxH: 280, query: '' };
  rootRef = React.createRef();
  listRef = React.createRef();

  componentDidMount() {
    this._out = (e) => {
      if (this.state.open && this.rootRef.current && !this.rootRef.current.contains(e.target)) this.close();
    };
    this._key = (e) => { if (e.key === 'Escape' && this.state.open) this.close(); };
    document.addEventListener('mousedown', this._out, true);
    document.addEventListener('keydown', this._key);
  }

  componentWillUnmount() {
    document.removeEventListener('mousedown', this._out, true);
    document.removeEventListener('keydown', this._key);
    clearTimeout(this._t);
  }

  close = () => this.setState({ open: false, query: '' });

  /* Measure against the nearest clipping ancestor so the panel opens where there is room. */
  place = () => {
    const el = this.rootRef.current;
    if (!el) return { up: false, maxH: 280 };
    const rect = el.getBoundingClientRect();
    let top = 0;
    let bottom = window.innerHeight;
    let node = el.parentElement;
    while (node && node !== document.body) {
      const oy = getComputedStyle(node).overflowY;
      if (oy === 'auto' || oy === 'scroll' || oy === 'hidden') {
        const b = node.getBoundingClientRect();
        top = Math.max(top, b.top);
        bottom = Math.min(bottom, b.bottom);
        break;
      }
      node = node.parentElement;
    }
    const inset = this.props.bottomInset == null ? 52 : Number(this.props.bottomInset);
    bottom = Math.min(bottom, window.innerHeight - inset);
    const below = bottom - rect.bottom - 10;
    const above = rect.top - top - 10;
    const want = 280;
    let up = below < Math.min(want, 190) && above > below;
    if (this.props.placement === 'up') up = true;
    if (this.props.placement === 'down') up = false;
    return { up, maxH: Math.max(140, Math.min(want, (up ? above : below) - 10)) };
  };

  reveal = () => {
    const opts = (this.props.options || []).map(o => (typeof o === 'string' ? o : o.value));
    const idx = opts.indexOf(this.props.value);
    if (idx < 4) return;
    let tries = 0;
    const settle = () => {
      const box = this.listRef.current;
      if (!this.state.open || this.state.query) return;
      if (box && box.scrollHeight > box.clientHeight + 4) {
        const el = box.querySelector('[aria-selected="true"]');
        box.scrollTop = el
          ? Math.max(0, el.offsetTop - box.clientHeight / 2 + el.offsetHeight / 2)
          : Math.max(0, idx * 37 - box.clientHeight / 2 + 18);
        return;
      }
      if (tries++ < 8) this._t = setTimeout(settle, 60);
    };
    this._t = setTimeout(settle, 40);
  };

  open = () => { this.setState({ open: true, query: '', ...this.place() }); this.reveal(); };

  renderVals() {
    const p = this.props;
    const st = this.state;
    const opts = (p.options || []).map(o => (typeof o === 'string' ? { value: o, label: o } : o));
    const cur = opts.filter(o => o.value === p.value)[0];
    const q = st.query.trim().toLowerCase();
    const shown = q ? opts.filter(o => String(o.label).toLowerCase().indexOf(q) >= 0) : opts;
    const searchable = p.searchable === true || opts.length > 12;
    const sm = p.size === 'sm';
    const h = sm ? 28 : 34;
    const fs = sm ? 12.5 : 13.5;
    const listMax = Math.max(96, st.maxH - (searchable ? 46 : 10));

    return {
      open: st.open, searchable, query: st.query,
      rootRef: this.rootRef, listRef: this.listRef,
      label: cur ? cur.label : (p.placeholder || 'Select'),
      triggerStyle: 'display:flex;align-items:center;gap:8px;width:100%;box-sizing:border-box;height:' + h
        + 'px;padding:0 ' + (sm ? 9 : 11) + 'px;border:1px solid ' + (st.open ? 'var(--mu-green)' : 'var(--mu-line-strong)')
        + ';border-radius:6px;background:var(--mu-surface);color:' + (cur ? 'var(--mu-ink)' : 'var(--mu-ink-3)')
        + ';font-family:\'DM Sans\',system-ui,sans-serif;font-size:' + fs + 'px;font-weight:500;cursor:pointer;'
        + 'box-shadow:' + (st.open ? 'var(--mu-ring)' : 'none') + ';transition:border-color 120ms ease,box-shadow 120ms ease',
      caretStyle: 'font-family:var(--mu-fa);font-weight:300;font-size:10px;color:var(--mu-ink-3);flex:none;transition:transform 140ms ease;transform:rotate('
        + (st.open ? '180deg' : '0deg') + ')',
      panelStyle: 'position:absolute;left:0;min-width:100%;width:max-content;max-width:320px;z-index:80;'
        + 'background:var(--mu-surface);border:1px solid var(--mu-line);border-radius:8px;box-shadow:var(--mu-pop);overflow:hidden;'
        + (st.up ? 'bottom:calc(100% + 5px);' : 'top:calc(100% + 5px);')
        + 'animation:mu-pop 120ms ease both',
      listStyle: 'max-height:' + listMax + 'px;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px',
      empty: shown.length === 0,
      items: shown.map(o => ({
        key: o.value, label: o.label, selected: o.value === p.value,
        style: 'display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;height:38px;padding:0 12px;border:0;border-radius:6px;'
          + 'background:' + (o.value === p.value ? 'var(--mu-green-soft)' : 'transparent')
          + ';color:var(--mu-ink);font-family:\'DM Sans\',system-ui,sans-serif;font-size:13px;font-weight:'
          + (o.value === p.value ? '600' : '400') + ';cursor:pointer;text-align:left',
        pick: () => { this.close(); if (p.onChange) p.onChange(o.value); }
      })),
      onQuery: (e) => this.setState({ query: e.target.value }),
      toggle: () => { if (st.open) { this.close(); return; } this.open(); },
      onKey: (e) => { if (e.key === 'ArrowDown' && !st.open) { e.preventDefault(); this.open(); } }
    };
  }
}
</script>
</body>
</html>
