<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/airly-fairytale-design-system-997ac652-003b-441a-a309-9d3abea33b6e/tokens/fonts.css">
<link rel="stylesheet" href="_ds/airly-fairytale-design-system-997ac652-003b-441a-a309-9d3abea33b6e/tokens/colors.css">
<link rel="stylesheet" href="_ds/airly-fairytale-design-system-997ac652-003b-441a-a309-9d3abea33b6e/tokens/typography.css">
<link rel="stylesheet" href="_ds/airly-fairytale-design-system-997ac652-003b-441a-a309-9d3abea33b6e/tokens/radius.css">
<link rel="stylesheet" href="_ds/airly-fairytale-design-system-997ac652-003b-441a-a309-9d3abea33b6e/tokens/spacing.css">
<link rel="stylesheet" href="_ds/airly-fairytale-design-system-997ac652-003b-441a-a309-9d3abea33b6e/tokens/elevation.css">
<link rel="stylesheet" href="_ds/airly-fairytale-design-system-997ac652-003b-441a-a309-9d3abea33b6e/tokens/interaction.css">
<link rel="stylesheet" href="_ds/airly-fairytale-design-system-997ac652-003b-441a-a309-9d3abea33b6e/tokens/base.css">
<link rel="stylesheet" href="_ds/airly-fairytale-design-system-997ac652-003b-441a-a309-9d3abea33b6e/ui/button.css">
<link rel="stylesheet" href="_ds/airly-fairytale-design-system-997ac652-003b-441a-a309-9d3abea33b6e/ui/forms.css">
<link rel="stylesheet" href="_ds/airly-fairytale-design-system-997ac652-003b-441a-a309-9d3abea33b6e/ui/overlay.css">
<link rel="stylesheet" href="_ds/airly-fairytale-design-system-997ac652-003b-441a-a309-9d3abea33b6e/styles.css">
<script src="_ds/airly-fairytale-design-system-997ac652-003b-441a-a309-9d3abea33b6e/_ds_bundle.js"></script>
</helmet>

<div ref="{{ rootRef }}" style="position:relative;width:100%;font-family:var(--font-ui)">
  <button type="button" style="{{ triggerStyle }}" style-hover="background-color:var(--surface-field-strong)" onClick="{{ toggle }}" onKeyDown="{{ onKey }}" aria-haspopup="listbox" aria-expanded="{{ open }}">
    <span style="flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ label }}</span>
    <x-import component-from-global-scope="AirlyDesignSystem_997ac6.Icon" name="chevron-down" weight="900" dc-props="{{ chevronProps }}" hint-size="11px,11px"></x-import>
  </button>

  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <x-import component-from-global-scope="AirlyDesignSystem_997ac6.Popover" open="{{ true }}" dc-props="{{ panelProps }}" hint-size="100%,200px">
      <div style="display:flex;flex-direction:column;gap:8px;min-height:0">
        <sc-if value="{{ searchable }}" hint-placeholder-val="{{ false }}">
          <x-import component-from-global-scope="AirlyDesignSystem_997ac6.SearchField" size="sm" placeholder="Filter..." dc-props="{{ searchProps }}" hint-size="100%,32px"></x-import>
        </sc-if>
        <div ref="{{ listRef }}" style="{{ listStyle }}">
          <x-import component-from-global-scope="AirlyDesignSystem_997ac6.Menu" items="{{ items }}" dc-props="{{ menuProps }}" hint-size="100%,160px"></x-import>
          <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
            <span style="display:block;padding:10px;font-size:12px;color:var(--text-tertiary)">No matches.</span>
          </sc-if>
        </div>
      </div>
    </x-import>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:260},&quot;options&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{value: string, label: string}&gt;&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(value: string) =&gt; void&quot;},&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Select&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sm&quot;,&quot;md&quot;],&quot;default&quot;:&quot;md&quot;,&quot;tsType&quot;:&quot;'sm' | 'md'&quot;},&quot;placement&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;down&quot;,&quot;up&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;'auto' | 'down' | 'up'&quot;},&quot;searchable&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { open: false, up: false, maxH: 264, query: '' };
  rootRef = React.createRef();

  componentDidMount() {
    this._out = (e) => {
      if (this.state.open && this.rootRef.current && !this.rootRef.current.contains(e.target)) this.close();
    };
    this._key = (e) => { if (e.key === 'Escape' && this.state.open) this.close(); };
    document.addEventListener('mousedown', this._out, true);
    document.addEventListener('keydown', this._key);
  }

  componentWillUnmount() {
    document.removeEventListener('mousedown', this._out, true);
    document.removeEventListener('keydown', this._key);
  }

  close = () => this.setState({ open: false, query: '' });
  listRef = React.createRef();

  /* On open, bring the current value into view in a long list. */
  revealSelected = () => {
    {
      const opts = (this.props.options || []).map(o => (typeof o === 'string' ? o : o.value));
      const idx = opts.indexOf(this.props.value);
      if (idx > 3) {
        /* the panel mounts a tick later, so settle first */
        clearTimeout(this._scrollT);
        let tries = 0;
        const settle = () => {
          const box = this.listRef.current;
          if (!this.state.open || this.state.query) return;
          if (box && box.scrollHeight > box.clientHeight + 4) {
            box.scrollTop = Math.max(0, idx * 35 - box.clientHeight / 2 + 17);
            return;
          }
          if (tries++ < 8) this._scrollT = setTimeout(settle, 60);
        };
        this._scrollT = setTimeout(settle, 40);
      }
    }
  }

  /* Measure the trigger against the nearest clipping ancestor (or the viewport)
     and decide which way the panel can actually open. */
  place = () => {
    const el = this.rootRef.current;
    if (!el) return { up: false, maxH: 264 };
    const rect = el.getBoundingClientRect();
    let top = 0;
    let bottom = window.innerHeight;
    let node = el.parentElement;
    while (node && node !== document.body) {
      const oy = getComputedStyle(node).overflowY;
      if (oy === 'auto' || oy === 'scroll' || oy === 'hidden') {
        const b = node.getBoundingClientRect();
        top = Math.max(top, b.top);
        bottom = Math.min(bottom, b.bottom);
        break;
      }
      node = node.parentElement;
    }
    const inset = this.props.bottomInset == null ? 58 : Number(this.props.bottomInset);
    bottom = Math.min(bottom, window.innerHeight - inset);
    const gap = 10;
    const below = bottom - rect.bottom - gap;
    const above = rect.top - top - gap;
    const want = 300;
    let up = below < Math.min(want, 190) && above > below;
    if (this.props.placement === 'up') up = true;
    if (this.props.placement === 'down') up = false;
    const room = (up ? above : below) - 12;
    return { up, maxH: Math.max(140, Math.min(want, room)) };
  };

  renderVals() {
    const p = this.props;
    const open = this.state.open;
    const q = this.state.query.trim().toLowerCase();
    const opts = (p.options || []).map(o => (typeof o === 'string' ? { value: o, label: o } : o));
    const cur = opts.filter(o => o.value === p.value)[0];
    const shown = q ? opts.filter(o => String(o.label).toLowerCase().indexOf(q) >= 0 || String(o.value).toLowerCase().indexOf(q) >= 0) : opts;
    const searchable = p.searchable === true || p.searchable === 'true' || opts.length > 12;
    const sm = p.size === 'sm';
    const h = sm ? 32 : 40;
    const px = sm ? 14 : 18;
    const fs = sm ? 12 : 14;
    const up = this.state.up;
    const listMax = Math.max(96, this.state.maxH - (searchable ? 68 : 24));

    return {
      open, searchable,
      rootRef: this.rootRef,
      label: cur ? cur.label : (p.placeholder || 'Select'),
      triggerStyle: 'display:flex;align-items:center;gap:8px;width:100%;box-sizing:border-box;height:' + h
        + 'px;padding:0 ' + px + 'px;border:0;border-radius:var(--radius-full);background:var(--surface-field);'
        + 'box-shadow:inset 0 0 0 1px ' + (open ? 'var(--blue-400)' : 'var(--border-field)') + ';'
        + 'color:' + (cur ? 'var(--text-primary)' : 'var(--text-interactive)') + ';font-family:var(--font-ui);font-size:' + fs
        + 'px;font-weight:500;text-align:left;cursor:pointer;transition:box-shadow 140ms cubic-bezier(.22,1,.36,1),background-color 140ms',
      chevronProps: {
        style: {
          fontSize: 10, color: 'var(--icon-interactive)', flex: 'none',
          transform: open ? 'rotate(180deg)' : 'rotate(0deg)',
          transition: 'transform 140ms cubic-bezier(.22,1,.36,1)'
        }
      },
      panelProps: {
        style: {
          position: 'absolute', left: 0, minWidth: '100%', width: 'max-content', maxWidth: 320,
          padding: 8, zIndex: 90,
          top: up ? 'auto' : 'calc(100% + 6px)', bottom: up ? 'calc(100% + 6px)' : 'auto',
          animation: 'ay-pop-in 140ms cubic-bezier(.22,1,.36,1) both'
        }
      },
      listRef: this.listRef,
      listStyle: 'max-height:' + listMax + 'px;overflow-y:auto;min-height:0',
      menuProps: { style: { background: 'transparent', boxShadow: 'none', padding: 0, minWidth: 0, borderRadius: 0 } },
      empty: shown.length === 0,
      items: shown.map(o => ({
        label: o.label,
        icon: o.value === p.value ? 'check' : null,
        onClick: () => { this.close(); if (p.onChange) p.onChange(o.value); }
      })),
      searchProps: {
        value: this.state.query,
        autoFocus: true,
        onChange: (e) => this.setState({ query: e.target.value }),
        onClear: () => this.setState({ query: '' })
      },
      toggle: () => {
        if (this.state.open) { this.close(); return; }
        this.setState({ open: true, query: '', ...this.place() });
        this.revealSelected();
      },
      onKey: (e) => {
        if (e.key === 'ArrowDown' && !open) {
          e.preventDefault();
          this.setState({ open: true, query: '', ...this.place() });
          this.revealSelected();
        }
      }
    };
  }
}
</script>
</body>
</html>
